<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basic Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .calculator {
            width: 350px;
            padding: 20px;
            border-radius: 20px;
            background: #222;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
        }

        .display {
            width: 100%;
            height: 90px;
            margin-bottom: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            outline: none;
            background: #111;
            color: white;
            text-align: right;
            font-size: 2.2rem;
        }


        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 65px;
            border: none;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            background: #333;
            color: white;
            transition: transform 0.15s, background 0.2s;
        }

        button:hover {
            background: #444;
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.94);
        }


        .operator {
            background: #ff9500;
        }

        .operator:hover {
            background: #ffad33;
        }

        .clear {
            background: #e74c3c;
        }

        .clear:hover {
            background: #ff6254;
        }

        .equal {
            background: #27ae60;
            grid-column: span 2;
        }

        .equal:hover {
            background: #2ecc71;
        }

        .zero {
            grid-column: span 2;
        }

        @media (max-width: 400px) {
            .calculator {
                width: 92%;
                padding: 15px;
            }

            button {
                height: 58px;
                font-size: 1.1rem;
            }

            .display {
                height: 80px;
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" id="display" class="display" value="0" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="appendValue('%')">%</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button class="zero" onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>
    </div>

    <script>

        const display = document.getElementById("display");

        function appendValue(value) {

            if (display.value === "0" ||
                display.value === "Error") {

                if (!isNaN(value) || value === ".") {
                    display.value = value;
                } else {
                    display.value += value;
                }

            } else {
                display.value += value;
            }
        }


        function clearDisplay() {
            display.value = "0";
        }

        function deleteLast() {

            if (display.value.length > 1) {
                display.value =
                    display.value.slice(0, -1);
            } else {
                display.value = "0";
            }
        }

        function calculate() {

            try {

                let expression = display.value;

                expression = expression.replace(
                    /(\d+(\.\d+)?)%/g,
                    "($1/100)"
                );

                let result = Function(
                    '"use strict"; return (' +
                    expression +
                    ')'
                )();

                if (!isFinite(result)) {
                    display.value = "Error";
                } else {
                    display.value = result;
                }

            } catch (error) {
                display.value = "Error";
            }
        }

        document.addEventListener("keydown", function (event) {

            const key = event.key;

            if (
                (key >= "0" && key <= "9") ||
                key === "+" ||
                key === "-" ||
                key === "*" ||
                key === "/" ||
                key === "." ||
                key === "%"
            ) {
                appendValue(key);
            }

            else if (key === "Enter" || key === "=") {
                calculate();
            }

            else if (key === "Backspace") {
                deleteLast();
            }

            else if (key === "Escape") {
                clearDisplay();
            }

        });

    </script>

</body>

</html>
